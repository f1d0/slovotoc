<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2547" />
  <title>Slovotoč — prototyp diakritiky</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="lab.css" />
</head>
<body>
  <div id="app">
    <div class="bg" aria-hidden="true">
      <div class="bg-blob b1"></div>
      <div class="bg-blob b2"></div>
      <div class="bg-blob b3"></div>
    </div>

    <header id="topbar">
      <div class="tb-left">
        <div id="pack-name">Prototyp · režim Klasik</div>
        <div id="level-label">Kolečko 1</div>
        <div id="words-left"></div>
      </div>
      <div class="tb-right">
        <button id="btn-prev" class="icon-btn" aria-label="Předchozí kolečko">‹</button>
        <button id="btn-next" class="icon-btn" aria-label="Další kolečko">›</button>
      </div>
    </header>

    <div id="mode-bar">
      <button data-mode="none">Bez háčků</button>
      <button data-mode="satellites">Háček u písmene</button>
      <button data-mode="tiles">Háček v kruhu</button>
    </div>

    <div id="pack-progress"><div id="pack-progress-fill"></div></div>

    <main id="board">
      <div id="grid" role="grid" aria-label="Křížovka"></div>
    </main>

    <div id="word-slot"><div id="word-pill" class="hidden"></div></div>

    <section id="controls">
      <div class="side-col left"></div>

      <div id="wheel-wrap">
        <div id="hint-tip">Háček a čárku táhni <b>před</b> písmenem · K→ˇ→R→´→I→D→L→O</div>
        <div id="wheel">
          <svg id="rope-svg"></svg>
          <button id="btn-shuffle" aria-label="Zamíchat">
            <svg viewBox="0 0 24 24"><path d="M4 7h3.5c4 0 5.5 6 9.5 6H21m-4-9 4 3-4 3M4 17h3.5c1.6 0 2.8-.9 3.9-2M21 17h-4c-1.6 0-2.8-.9-3.9-2m7.9-1 4 3-4 3" transform="scale(0.85) translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div class="side-col right">
        <button id="btn-jar" class="tool-btn" aria-label="Bonusová slova">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.2 5.6.7-4.1 3.9 1 5.6-4.9-2.7-4.9 2.7 1-5.6L4 7.9l5.6-.7z" fill="currentColor"/></svg>
          <span class="cost jar-count"><i id="bonus-count">0</i></span>
        </button>
      </div>
    </section>

    <div id="overlay" class="hidden"><div id="overlay-card"></div></div>
    <canvas id="confetti"></canvas>
    <div id="toast" class="hidden"></div>
  </div>

  <script type="module" src="lab.js"></script>
</body>
</html>
