<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b2547" />
  <!-- Without these iOS draws its own opaque white status bar above the game.
       "black-translucent" lets the page run under it instead; #app already
       keeps the content clear with a safe-area inset. -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Slovotoč" />
  <meta name="description" content="Slovotoč – česká slovní hra. Spojuj písmena, hledej slova a vyplň křížovku." />
  <title>Slovotoč</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <!-- 180×180 and edge-to-edge: iOS masks it itself and paints transparency black -->
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chrome fires this before the deferred module runs, so it is caught here
       and handed to the game when the player asks to install. -->
  <script>
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); window.__installPrompt = e; });
    window.addEventListener('appinstalled', () => { window.__installPrompt = null; });
  </script>
</head>
<body>
  <!-- Decorative background layers. Deliberately a sibling of #app, not a
       child: WebKit clips a position:fixed element to an ancestor that has
       overflow:hidden, which is what kept the photo off the bottom of an
       installed iOS app however tall it was made. -->
  <div class="bg" aria-hidden="true">
    <div id="bg-photo"></div>
    <div class="bg-blob b1"></div>
    <div class="bg-blob b2"></div>
    <div class="bg-blob b3"></div>
  </div>

  <div id="app">

    <header id="topbar">
      <div class="tb-left">
        <div id="pack-name">–</div>
        <div id="level-label">Úroveň 1</div>
        <div id="words-left"></div>
      </div>
      <div class="tb-right">
        <button id="btn-exit-daily" class="icon-btn hidden" aria-label="Zpět do hlavní hry">✕</button>
        <button id="btn-player" class="icon-btn" aria-label="Hráči a žebříček">
          <span id="player-avatar">🏆</span>
        </button>
        <button id="btn-sound" class="icon-btn" aria-label="Zvuk">
          <svg viewBox="0 0 24 24" class="ic-sound-on"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" class="ic-sound-off" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <div id="coins" title="Mince">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ffc93c" stroke="#e6a817" stroke-width="1.6"/><text x="12" y="16" text-anchor="middle" font-size="11" font-weight="900" fill="#8a5a00">S</text></svg>
          <span id="coin-count">0</span>
        </div>
      </div>
    </header>

    <div id="pack-progress"><div id="pack-progress-fill"></div></div>

    <main id="board">
      <div id="grid" role="grid" aria-label="Křížovka"></div>
    </main>

    <div id="word-slot">
      <div id="word-pill" class="hidden"></div>
      <button id="btn-report" class="hidden" aria-label="Nahlásit slovo">⚑</button>
    </div>

    <section id="controls">
      <div class="side-col left">
        <button id="btn-bulb" class="tool-btn" aria-label="Nápověda – odkrýt náhodné písmeno">
          <svg viewBox="0 0 24 24"><path d="M9 18h6m-5 3h4M12 3a6 6 0 0 0-4 10.5c1 1 1.5 1.5 1.5 3h5c0-1.5.5-2 1.5-3A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="cost"><i>25</i></span>
        </button>
        <button id="btn-hammer" class="tool-btn" aria-label="Nápověda – vyber políčko">
          <svg viewBox="0 0 24 24"><path d="M14.5 4.5l5 5-2 2-5-5zM12.5 8.5L4 17l3 3 8.5-8.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="cost"><i>60</i></span>
        </button>
      </div>

      <div id="wheel-wrap">
        <div id="hint-tip" class="hidden">Spoj písmena tahem prstu</div>
        <div id="wheel">
          <svg id="rope-svg"></svg>
          <button id="btn-shuffle" aria-label="Zamíchat písmena">
            <svg viewBox="0 0 24 24"><path d="M4 7h3.5c4 0 5.5 6 9.5 6H21m-4-9 4 3-4 3M4 17h3.5c1.6 0 2.8-.9 3.9-2M21 17h-4c-1.6 0-2.8-.9-3.9-2m7.9-1 4 3-4 3" transform="scale(0.85) translate(2 2)" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <!-- letter buttons injected here -->
        </div>
      </div>

      <div class="side-col right">
        <button id="btn-jar" class="tool-btn" aria-label="Bonusová slova">
          <svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.2 5.6.7-4.1 3.9 1 5.6-4.9-2.7-4.9 2.7 1-5.6L4 7.9l5.6-.7z" fill="currentColor"/></svg>
          <span class="cost jar-count"><i id="bonus-count">0</i></span>
        </button>
      </div>
    </section>

    <!-- overlays -->
    <div id="overlay" class="hidden">
      <div id="overlay-card"></div>
    </div>
    <canvas id="confetti"></canvas>
    <div id="toast" class="hidden"></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
