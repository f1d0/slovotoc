name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/words-of-wonders-clone-4dcovw]
    paths: ['web/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish web/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          force_orphan: true
          # force_orphan wipes gh-pages on every deploy, so the CNAME file has
          # to be written by the action – adding it by hand would not survive.
          cname: slovotoc.cz
          commit_message: 'Deploy Slovotoč'
